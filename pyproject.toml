[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "onshape-topopt"
version = "0.1.0"
description = "Topology optimization for flat robot plates designed in Onshape"
readme = "README.md"
license = "MIT"
authors = [{ name = "Zhanibek Kassimov" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7", "requests>=2.28"]
keywords = ["onshape", "topology optimization", "cad", "robotics", "vex", "simp"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
onshape-topopt = "onshape_topopt.cli:main"

[project.urls]
Homepage = "https://github.com/zhonibek/onshape-topology-optimization"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
